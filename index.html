<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenDecision - Ambiances Sonores pour Votre Bien-Être</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="Créez votre ambiance parfaite avec ZenDecision. Sons pour le sommeil, l'étude, la joie et la détente.">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="logo">
                <span class="logo-icon">✨</span>
                ZenDecision
            </h1>
            <div class="header-controls">
                <button id="install-btn" class="install-btn" style="display: none;" title="Installer ZenDecision sur votre appareil">
                    <span>📲</span>
                    <span>Installer</span>
                </button>
                <button id="theme-toggle" class="theme-toggle" title="Basculer entre le mode clair et sombre">
                    🌙
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="section-focus" class="tab-content active">
            <!-- Titre et description -->
            <div class="focus-intro">
                <h2>Créez votre ambiance parfaite</h2>
                <p>Mélangez plusieurs sons pour une expérience personnalisée et apaisante</p>
            </div>

            <!-- Sélecteur de catégories et Bouton Aléatoire -->
            <div class="focus-controls">
                <div class="category-selector">
                    <button class="category-btn active" data-category="sommeil">🌙 Sommeil</button>
                    <button class="category-btn" data-category="etude">📚 Étude</button>
                    <button class="category-btn" data-category="joie">😊 Joie</button>
                    <button class="category-btn" data-category="promenade">🥾 Promenade</button>
                </div>
                <button id="random-sound-btn" class="random-btn" title="Choisir un son aléatoirement">
                    <span class="dice-icon">🎲</span>
                </button>
            </div>

            <!-- Grille de sons par catégorie -->
            <div class="sound-grid" id="sound-grid">
                <!-- Les sons seront générés par JavaScript -->
            </div>

            <!-- Contrôle de volume global -->
            <div class="volume-control">
                <label for="master-volume">Volume général</label>
                <div class="volume-slider-wrapper">
                    <span>🔇</span>
                    <input type="range" id="master-volume" min="0" max="100" value="70" class="volume-slider">
                    <span>🔊</span>
                </div>
            </div>

            <!-- Indicateur de sons actifs -->
            <div class="active-sounds">
                <h3>Sons actifs</h3>
                <div id="active-sounds-list" class="active-sounds-list"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>ZenDecision © 2026 | Trouvez votre zen</p>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log("SW registration failed", err));
            });
        }
    </script>
</body>
</html>
