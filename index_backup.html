<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenDecision - Focus & Ambiance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="logo">
                <span class="logo-icon">✨</span>
                ZenDecision
            </h1>
            <button id="install-btn" class="install-btn" style="display: none;">
                <span>📲 Installer l'App</span>
            </button>
        </div>
        <!-- Navigation supprimée car il n'y a plus qu'une seule section -->
    </header>

    <main>
        <!-- Section Focus : Sons d'ambiance -->
        <section id="section-focus" class="tab-content active">
            <div class="focus-intro">
                <h2>Créez votre ambiance parfaite</h2>
                <p>Mélangez plusieurs sons pour une expérience personnalisée</p>
            </div>

            <!-- Sélecteur de catégories et Bouton Aléatoire -->
            <div class="focus-controls">
                <div class="category-selector">
                    <button class="category-btn active" data-category="nature">🌿 Nature</button>
                    <button class="category-btn" data-category="ambiance">🏠 Ambiance</button>
                    <button class="category-btn" data-category="urbain">🏙️ Urbain</button>
                    <button class="category-btn" data-category="relaxation">🧘 Relaxation</button>
                </div>
                <button id="random-sound-btn" class="random-btn" title="Choisir un son aléatoirement">
                    <span class="dice-icon">🎲</span>
                </button>
            </div>

            <!-- Grille de sons par catégorie -->
            <div class="sound-grid" id="sound-grid">
                <!-- Les sons seront générés par JavaScript -->
            </div>

            <!-- Contrôle de volume global -->
            <div class="volume-control">
                <label for="master-volume">Volume général</label>
                <div class="volume-slider-wrapper">
                    <span>🔇</span>
                    <input type="range" id="master-volume" min="0" max="100" value="70" class="volume-slider">
                    <span>🔊</span>
                </div>
            </div>

            <!-- Indicateur de sons actifs -->
            <div class="active-sounds">
                <h3>Sons actifs</h3>
                <div id="active-sounds-list" class="active-sounds-list"></div>
            </div>
        </section>


    </main>

    <footer>
        <p>ZenDecision © 2026 | Trouvez votre zen</p>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log("SW registration failed", err));
            });
        }
    </script>
    <!-- Script de monétisation -->
    <script src="https://pl28725493.profitablecpmratenetwork.com/92/24/15/922415557c0b2e238f75d831946ca7cc.js"></script>
</body>
</html>
